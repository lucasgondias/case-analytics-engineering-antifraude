      settled_count: 4
      previous_month_settled_count: 0
      fraud_report_count: 1
      dispute_count: 1
      visa_vamp_ratio: 0.5
      mc_ecm_ratio: null
    - merchant_id: m_c
      card_network: mastercard
      month_start: '2026-02-01'
      settled_count: 2
      previous_month_settled_count: 0
      fraud_report_count: 0
      dispute_count: 0
      visa_vamp_ratio: null
      mc_ecm_ratio: null
    - merchant_id: m_c
      card_network: mastercard
      month_start: '2026-03-01'
      settled_count: 0
      previous_month_settled_count: 2
      fraud_report_count: 0
      dispute_count: 1
      visa_vamp_ratio: null
      mc_ecm_ratio: 0.5
- name: incremental_picks_out_of_order_events_and_duplicate_neighbors
  description: 'Watermark em 12:00 com sobreposição de 6h. tx_late foi ingerida às 11:00 (fora de ordem): entra
    (B1). tx_old (ingerida às 05:00) não entra. tx_dup_old é antiga, mas é vizinha de duplicidade de tx_new (mesmo
    usuário, mesmo segundo): reabre para a flag não ficar velha (B4).'
  model: fct_payment_attempts
  overrides:
    macros:
      is_incremental: true
  given:
  - input: this
    format: sql
    rows: select 'tx_already_loaded' as transaction_id, timestamp '2026-03-01 12:00:00' as _tx_watermark, timestamp
      '2026-03-01 12:00:00' as _eval_watermark, timestamp '2026-03-01 12:00:00' as _cb_watermark, timestamp '2026-03-01
      12:00:00' as _enrichment_watermark, timestamp '2026-03-01 12:00:00' as _label_watermark, timestamp '2026-03-01
      12:00:00' as _refund_watermark
  - input: ref('stg_payments__transactions')
    rows:
    - transaction_id: tx_old
      user_id: usr_a
      transaction_at: '2026-03-01 05:00:00'
      transaction_date: '2026-03-01'
      amount: 100.0
      status: approved
      payment_method: credit_card
      is_approved: true
      is_chargeback_eligible: true
      _ingested_at: '2026-03-01 05:00:00'
    - transaction_id: tx_late
      user_id: usr_b
      transaction_at: '2026-03-01 10:59:00'
      transaction_date: '2026-03-01'
      amount: 100.0
      status: approved
      payment_method: credit_card
      is_approved: true
      is_chargeback_eligible: true
      _ingested_at: '2026-03-01 11:00:00'
    - transaction_id: tx_dup_old
      user_id: usr_c
      transaction_at: '2026-03-01 12:30:00'
      transaction_date: '2026-03-01'
      amount: 100.0
      status: approved
      payment_method: credit_card
      is_approved: true
      is_chargeback_eligible: true
      _ingested_at: '2026-03-01 01:00:00'
    - transaction_id: tx_new
      user_id: usr_c
      transaction_at: '2026-03-01 12:30:00'
      transaction_date: '2026-03-01'
      amount: 100.0
      status: approved
      payment_method: credit_card
      is_approved: true
      is_chargeback_eligible: true
      _ingested_at: '2026-03-01 12:30:00'
  - input: ref('stg_risk__evaluations')
    rows: []
  - input: ref('stg_acquirer__chargebacks')
    rows: []
  - input: ref('stg_payments__enrichment')
    rows: []
  - input: ref('fct_fraud_labels')
    rows: []
  - input: ref('stg_payments__refunds')
    rows: []
  - input: ref('int_risk__decision_per_transaction')
    rows: []
  - input: ref('int_chargebacks__per_transaction')
    rows: []
  - input: ref('int_transactions__duplicate_suspects')
    rows:
    - transaction_id: tx_dup_old
      first_transaction_id_in_group: tx_dup_old
      group_size: 2
      is_duplicate_candidate: false
    - transaction_id: tx_new
      first_transaction_id_in_group: tx_dup_old
      group_size: 2
      is_duplicate_candidate: true
  - input: ref('ref_issuer_response_codes')
    rows: []
  - input: ref('int_fraud_labels__per_transaction')
    rows: []
  expect:
    rows:
    - transaction_id: tx_late
      is_duplicate_candidate: false
    - transaction_id: tx_dup_old
      is_duplicate_candidate: false
    - transaction_id: tx_new
      is_duplicate_candidate: true
