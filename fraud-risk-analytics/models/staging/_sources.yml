version: 2

sources:
  - name: raw
    description: >
      Camada Bronze. Append-only, cópia fiel do produtor + metadado de ingestão (_ingested_at).
      Em produção é carregada pela ingestão (CDC/stream); aqui vem de seeds.
    schema: raw
    loaded_at_field: _ingested_at
    tables:
      - name: raw_transactions
        description: Tentativas de pagamento enviadas para risco/autorização (produtor - Payments).
        config:
          freshness:
            warn_after: {count: 30, period: minute}
            error_after: {count: 2, period: hour}
        columns:
          - name: transaction_id
            data_tests: [not_null]
          - name: status
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["approved", "declined", "error"]

      - name: raw_risk_evaluations
        description: Decisões do motor de risco (produtor - Risk Engine).
        config:
          freshness:
            warn_after: {count: 30, period: minute}
            error_after: {count: 2, period: hour}
        columns:
          - name: evaluation_id
            data_tests: [not_null, unique]
          - name: risk_action
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["approve", "reject", "review"]

      - name: raw_chargebacks
        description: >
          Notificações assíncronas da adquirente. Chegam D+N (até 90 dias, contrato com Risco).
          Freshness é o monitor mais importante do projeto: se o feed para, o CB rate "melhora" sozinho.
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
        columns:
          - name: chargeback_id
            data_tests: [not_null, unique]

  - name: raw_v2
    description: >
      Fontes propostas no contrato v2 (não existem no enunciado). Seeds só com colunas, sem linhas:
      lojista, rótulo antecipado (TC40/SAFE), reembolso, alerta pré-disputa, MED do Pix, desfecho de
      disputa e regras em shadow mode. A lógica que as consome é provada em models/_unit_tests.yml.
    schema: raw
    loaded_at_field: _ingested_at
    tables:
      - name: raw_payment_enrichment
        description: Atributos do pagamento que o contrato v1 não traz (lojista, pedido, 3DS, código do emissor, liquidação).
        columns:
          - name: transaction_id
            data_tests: [unique, not_null]
      - name: raw_merchants
        columns:
          - name: merchant_id
            data_tests: [unique, not_null]
      - name: raw_issuer_fraud_reports
        description: >
          Relatórios de fraude do emissor à bandeira (Visa TC40 / Mastercard SAFE). Chegam dias após
          a transação, antes do chargeback, e contam no VAMP mesmo sem chargeback.
        config:
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 4, period: day}
        columns:
          - name: report_id
            data_tests: [unique, not_null]
      - name: raw_refunds
        columns:
          - name: refund_id
            data_tests: [unique, not_null]
      - name: raw_dispute_alerts
        description: Alertas pré-disputa (Verifi RDR / Order Insight, Ethoca). Resolvidos antes de virar chargeback.
      - name: raw_pix_med_claims
        description: Contestações de Pix via MED 2.0 (Bacen). Prazo do pagador de até 80 dias.
      - name: raw_chargeback_outcomes
        description: Desfecho da disputa (reapresentação, arbitragem). Base da perda líquida.
      - name: raw_risk_rule_hits
        description: Uma linha por regra avaliada, com versão e se está em shadow mode (avalia mas não decide).
