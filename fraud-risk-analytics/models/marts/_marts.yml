version: 2
groups:
- name: anti_fraud_risk
  owner:
    name: Data & Analytics Engineering - Anti-Fraud & Risk
    email: data-risk@example.com
models:
- name: fct_payment_attempts
  description: 'Fonte única da verdade de tentativas de pagamento. 1 linha por transaction_id com a decisão de risco
    vigente na autorização, o desfecho de chargeback (label tardio) e flags de qualidade. Flags nunca filtram linhas:
    a métrica oficial segue o contrato, as flags permitem auditar.

    '
  group: anti_fraud_risk
  access: public
  config:
    contract:
      enforced: true
    meta:
      owner: data-risk
      tier: 1
      sla: D-0 até 07:00 BRT; chargebacks atualizam safras afetadas a cada run
      pii:
      - user_id
  columns:
  - name: transaction_id
    data_type: varchar
    constraints:
    - type: not_null
    - type: primary_key
    data_tests:
    - unique
    - not_null
  - name: user_id
    data_type: varchar
    meta:
      pii: true
  - name: merchant_id
    data_type: varchar
    description: Lojista (contrato v2). Programas das bandeiras e perda não recuperada são medidos por lojista.
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_merchant')
          field: merchant_id
  - name: order_id
    data_type: varchar
    description: Pedido (contrato v2). Base da aprovação por intenção de compra (retentativas agrupadas).
  - name: country
    data_type: varchar
    description: País da operação (ISO-3166). Define moeda, fuso da safra e prazos de disputa.
  - name: transaction_at
    data_type: timestamp
  - name: cohort_date
    data_type: date
    description: Safra = data local da transação. Chargebacks são atribuídos aqui, nunca em chargeback_at.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_day
  - name: amount
    data_type: decimal(18,2)
  - name: currency
    data_type: varchar
  - name: status
    data_type: varchar
  - name: payment_method
    data_type: varchar
  - name: card_network
    data_type: varchar
  - name: is_chargeback_eligible
    data_type: boolean
    description: Cartão. Pix tem MED, não chargeback; não entra no denominador do CB rate de cartão.
  - name: three_ds_result
    data_type: varchar
  - name: is_3ds_authenticated
    data_type: boolean
    description: 'Liability shift: fraude em transação autenticada tende a ser responsabilidade do emissor.'
  - name: is_approved
    data_type: boolean
  - name: decline_source
    data_type: varchar
    description: risk_engine | manual_review | issuer_or_acquirer | technical_error | unknown_no_risk_evaluation
      | null (aprovada).
    data_tests:
    - accepted_values:
        arguments:
          values:
          - risk_engine
          - manual_review
          - issuer_or_acquirer
          - technical_error
          - unknown_no_risk_evaluation
  - name: issuer_decline_type
    data_type: varchar
    description: 'soft (saldo, limite, indisponível: retentável) | hard (cartão bloqueado, roubado) | unknown. Só
      para recusa do emissor.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - soft
          - hard
          - unknown
  - name: issuer_response_code
    data_type: varchar
  - name: capture_status
    data_type: varchar
  - name: settled_at
    data_type: timestamp
  - name: payout_term_days
    data_type: integer
    description: Prazo de repasse ao lojista (D+2/D+14/D+30). Repasse antes do fim da janela de chargeback é exposição
      da plataforma.
  - name: is_settled
    data_type: boolean
    description: Capturada/liquidada. Denominador dos programas das bandeiras é liquidadas, não aprovadas.
  - name: evaluation_id
    data_type: varchar
  - name: risk_score
    data_type: integer
  - name: risk_action
    data_type: varchar
  - name: rule_triggered
    data_type: varchar
  - name: decision_source
    data_type: varchar
    description: automatic | manual_review (interna) | partner_review (parceiro antifraude). Separa o mérito do
      motor do mérito da revisão.
  - name: evaluation_count
    data_type: bigint
  - name: has_chargeback
    data_type: boolean
  - name: has_fraud_chargeback
    data_type: boolean
  - name: chargeback_count
    data_type: bigint
  - name: chargeback_amount
    data_type: decimal(38,2)
  - name: fraud_chargeback_amount
    data_type: decimal(38,2)
  - name: first_chargeback_at
    data_type: timestamp
  - name: days_to_first_chargeback
    data_type: bigint
  - name: is_fraud_labeled
    data_type: boolean
    description: Existe ao menos uma evidência de fraude (TC40/SAFE, chargeback de fraude, reembolso por fraude,
      alerta, MED).
  - name: first_fraud_label_at
    data_type: timestamp
  - name: first_fraud_label_source
    data_type: varchar
    description: Origem da primeira evidência. TC40/SAFE costuma chegar dias antes do chargeback.
  - name: fraud_label_sources
    data_type: varchar
  - name: days_to_fraud_label
    data_type: bigint
    description: 'Dias até o primeiro rótulo: encurta a maturação da safra em relação ao chargeback.'
  - name: refund_amount
    data_type: decimal(38,2)
  - name: fraud_refund_amount
    data_type: decimal(38,2)
  - name: is_approved_without_risk_evaluation
    data_type: boolean
    description: Aprovada sem avaliação de risco = fail-open do motor ou perda de evento no feed.
  - name: is_approved_despite_risk_reject
    data_type: boolean
  - name: is_duplicate_candidate
    data_type: boolean
  - name: duplicate_of_transaction_id
    data_type: varchar
  - name: _tx_watermark
    data_type: timestamp
  - name: _eval_watermark
    data_type: timestamp
  - name: _cb_watermark
    data_type: timestamp
  - name: _enrichment_watermark
    data_type: timestamp
  - name: _label_watermark
    data_type: timestamp
  - name: _refund_watermark
    data_type: timestamp
  - name: _updated_at
    data_type: timestamp with time zone
- name: fct_chargebacks
  description: 1 linha por evento de chargeback, com safra da transação original e lag de notificação.
  group: anti_fraud_risk
  access: public
  columns:
  - name: chargeback_id
    data_tests:
    - unique
    - not_null
  - name: is_orphan
    description: Chargeback sem transação conhecida (late-arriving ou falha de ingestão de transações).
  - name: merchant_id
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_merchant')
          field: merchant_id
- name: agg_chargeback_cohort_daily
  description: 'Safra x método. Só numeradores e denominadores aditivos e só o que é função do dado: idade e maturidade
    são calculadas na leitura (rpt_chargeback_cohort_maturity). Incremental por safra afetada.'
  group: anti_fraud_risk
  access: public
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - cohort_date
        - payment_method
- name: agg_approval_daily
  description: Funil diário com recusa decomposta por origem (risco x emissor x erro técnico).
  group: anti_fraud_risk
  access: public
- name: agg_risk_rule_performance
  description: Performance por regra e faixa de score. Falso negativo = aprovado com chargeback de fraude.
  group: anti_fraud_risk
  access: public
- name: rpt_metric_definition_sensitivity
  description: Mesmo dado, 4 definições, 4 números. Evidência para padronizar a métrica na camada semântica.
  group: anti_fraud_risk
  access: protected
- name: fct_fraud_labels
  description: 'Label store: 1 linha por evidência de fraude, com origem e data em que ficamos sabendo (label_at).
    Base para rótulo antecipado e treino sem vazamento.'
  group: anti_fraud_risk
  access: public
  columns:
  - name: transaction_id
    data_tests:
    - not_null
  - name: evidence_id
    data_tests:
    - not_null
  - name: label_source
    data_tests:
    - accepted_values:
        arguments:
          values:
          - issuer_fraud_report
          - chargeback_fraud
          - fraud_refund
          - dispute_alert
          - pix_med_claim
- name: rpt_chargeback_cohort_maturity
  description: Safra com idade, maturidade, taxas e fraude em bps calculadas na leitura (view).
  group: anti_fraud_risk
  access: public
- name: agg_network_monitoring_monthly
  description: 'Segunda taxa de chargeback: ratio das bandeiras (Visa VAMP, Mastercard ECM/EFM) por lojista x bandeira
    x mês de notificação, com projeção intramês e status contra os limites.'
  group: anti_fraud_risk
  access: public
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - merchant_id
        - card_network
        - month_start
- name: agg_merchant_loss_monthly
  description: 'Perda por lojista x mês: bruta, líquida (após disputa), recuperada do lojista e não recuperada pela
    plataforma; perda líquida de Pix via MED.'
  group: anti_fraud_risk
  access: public
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - merchant_id
        - month_start
- name: agg_rule_backtest
  description: 'Backtest e performance por regra x versão x modo (enforced/shadow): precisão, cobertura, custo em
    conversão e sobreposição.'
  group: anti_fraud_risk
  access: public
  data_tests:
  - unique_combination:
      arguments:
        columns:
        - rule_id
        - rule_version
        - rule_mode
- name: rpt_merchant_open_exposure
  description: 'Exposição por lojista: valor de cartão já repassado que ainda está dentro da janela de chargeback,
    e perda esperada com a taxa histórica. Calculado na leitura (view).'
  group: anti_fraud_risk
  access: public
- name: dim_merchant
  description: Dimensão conformada de lojista. Em produção, snapshot SCD2.
  group: anti_fraud_risk
  access: public
  columns:
  - name: merchant_id
    data_tests:
    - unique
    - not_null
- name: dim_date
  description: Dimensão de data conformada (safra, mês de notificação).
  group: anti_fraud_risk
  access: public
  columns:
  - name: date_day
    data_tests:
    - unique
    - not_null
- name: dim_risk_rule
  description: Dimensão de regras do motor, uma linha por versão; is_shadow indica regra que só avalia.
  group: anti_fraud_risk
  access: public
  columns:
  - name: rule_key
    data_tests:
    - unique
    - not_null
