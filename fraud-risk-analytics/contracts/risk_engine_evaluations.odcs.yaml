# Data Contract - Open Data Contract Standard (ODCS) v3
# Produtor: time do Motor de Risco | Consumidor: Data & AE Anti-Fraud & Risk
apiVersion: v3.0.2
kind: DataContract
id: risk-engine-evaluations
name: raw_risk_evaluations
version: 2.0.0
status: proposed
domain: payments-risk

description:
  purpose: Decisões e scores do motor de risco, 1 evento por avaliação (pode haver N por transação).

schema:
  - name: raw_risk_evaluations
    physicalType: table
    properties:
      - name: evaluation_id
        logicalType: string
        required: true
        unique: true
        primaryKey: true
      - name: transaction_id
        logicalType: string
        required: true
      - name: evaluated_at
        logicalType: timestamp
        required: true
        description: ISO-8601 com offset. Mesmo relógio (NTP) do gateway de pagamento.
      - name: risk_score
        logicalType: integer
        required: true
        description: Inteiro 0-100. Hoje chega como string ("05").
      - name: risk_action
        logicalType: string
        required: true
        description: approve | reject | review
      - name: rules_triggered
        logicalType: array
        required: false
        description: "[v2] Lista de regras disparadas. Hoje é 1 campo e mistura regra com desfecho."
      - name: decision_source
        logicalType: string
        required: true
        description: "[v2] automatic | manual_review | fallback_timeout. Fail-open passa a ser explícito."
      - name: model_version
        logicalType: string
        required: true
        description: "[v2] Versão do modelo/conjunto de regras. Permite comparar antes x depois de deploy."
      - name: is_holdout
        logicalType: boolean
        required: true
        description: >
          [v2] Transação de grupo de controle (aprovada independentemente do score). Única forma
          de medir falso positivo sem viés de seleção.

quality:
  - rule: completeness
    description: Toda transação enviada ao motor tem >= 1 avaliação. Aprovada sem avaliação > 1% = P1.
    mustBeLessThan: 0.01
  - rule: distribution
    description: PSI do risk_score vs. 28 dias < 0,2 (drift de modelo ou de população).
    mustBeLessThan: 0.2

slaProperties:
  - property: latency
    value: 5
    unit: minutes
  - property: frequency
    value: streaming

team:
  - role: owner
    name: Motor de Risco
  - role: consumer
    name: Data & Analytics Engineering - Anti-Fraud & Risk
